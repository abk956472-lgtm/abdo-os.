<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إمبراطور الظلام والنور - المواجهة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050508; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .title {
            position: absolute; top: 20px; right: 30px; color: #fff;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #00e5ff; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="title">
        <h2>إمبراطور الظلام والنور</h2>
        <p>أيومي أشيا ضد قائد الشياطين</p>
    </div>

    <canvas id="stage"></canvas>

    <script>
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let frame = 0;
        let shake = 0;
        const particles = [];

        // مواضع وإحداثيات الشخصيتين
        const ayumi = { x: 0, y: 0, vx: 0, state: 'idle', auraColor: '#00e5ff', weaponColor: '#ffe600' };
        const demon = { x: 0, y: 0, vx: 0, state: 'idle', auraColor: '#ff0055', weaponColor: '#a000ff' };

        class Particle {
            constructor(x, y, color, vx, vy, size, life) {
                this.x = x; this.y = y; this.color = color;
                this.vx = vx; this.vy = vy; this.size = size;
                this.life = life; this.maxLife = life;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.size *= 0.95; this.life--;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y, color1, color2) {
            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                particles.push(new Particle(
                    x, y, Math.random() > 0.5 ? color1 : color2,
                    Math.cos(angle) * speed, Math.sin(angle) * speed,
                    Math.random() * 6 + 3, 30
                ));
            }
        }

        // رسم شخصية مبسطة (Stickman Anime Style)
        function drawStickFigure(char, isDemon = false) {
            ctx.save();
            ctx.translate(char.x, char.y);

            // هالة الطاقة
            const aura = ctx.createRadialGradient(0, -40, 10, 0, -40, 70);
            aura.addColorStop(0, char.auraColor);
            aura.addColorStop(1, 'transparent');
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(0, -40, 80, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.shadowColor = char.auraColor;
            ctx.shadowBlur = 15;

            // الرأس
            ctx.beginPath();
            ctx.arc(0, -70, 14, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.stroke();

            // قرون لقائد الشياطين
            if (isDemon) {
                ctx.strokeStyle = '#ff0055';
                ctx.beginPath();
                ctx.moveTo(-8, -80); ctx.lineTo(-18, -100);
                ctx.moveTo(8, -80); ctx.lineTo(18, -100);
                ctx.stroke();
                ctx.strokeStyle = '#fff';
            }

            // الجذع
            ctx.beginPath();
            ctx.moveTo(0, -56);
            ctx.lineTo(0, -20);
            ctx.stroke();

            // حركة الأرجل والأذرع بناءً على الحالة
            const cycle = Math.sin(frame * 0.2);
            if (char.state === 'dash') {
                // وضعية الاندفاع السريع
                ctx.beginPath();
                ctx.moveTo(0, -20); ctx.lineTo(-20, 10);
                ctx.moveTo(0, -20); ctx.lineTo(20, -5);
                ctx.moveTo(0, -45); ctx.lineTo(30, -35); // يد السيف
                ctx.stroke();
            } else if (char.state === 'attack') {
                // وضعية الضرب بالسيف
                ctx.beginPath();
                ctx.moveTo(0, -20); ctx.lineTo(-15, 10);
                ctx.moveTo(0, -20); ctx.lineTo(15, 10);
                ctx.moveTo(0, -45); ctx.lineTo(35, -55);
                ctx.stroke();

                // رسم سيف النور/الظلام أثناء الهجوم
                ctx.strokeStyle = char.weaponColor;
                ctx.lineWidth = 7;
                ctx.shadowColor = char.weaponColor;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.moveTo(35, -55); ctx.lineTo(75, -65);
                ctx.stroke();
            } else {
                // الوضعية العادية (Idle)
                ctx.beginPath();
                ctx.moveTo(0, -20); ctx.lineTo(-10 + cycle * 5, 10);
                ctx.moveTo(0, -20); ctx.lineTo(10 - cycle * 5, 10);
                ctx.moveTo(0, -45); ctx.lineTo(-15, -25);
                ctx.moveTo(0, -45); ctx.lineTo(15, -25);
                ctx.stroke();
            }

            ctx.restore();
        }

        // السيناريو القتالي التلقائي (المخرج الآلي)
        function updateBattleLogic() {
            const groundY = canvas.height * 0.75;
            ayumi.y = groundY;
            demon.y = groundY;

            const sequence = Math.floor(frame / 60) % 6; // مخرج القتال يتغير كل ثانية

            if (sequence === 0) {
                // الاستعداد والتقارب
                ayumi.x = canvas.width * 0.25;
                demon.x = canvas.width * 0.75;
                ayumi.state = 'idle';
                demon.state = 'idle';
            } else if (sequence === 1) {
                // اندفاع الطرفين نحو المنتصف
                ayumi.x += (canvas.width * 0.45 - ayumi.x) * 0.15;
                demon.x += (canvas.width * 0.55 - demon.x) * 0.15;
                ayumi.state = 'dash';
                demon.state = 'dash';
            } else if (sequence === 2 || sequence === 3) {
                // الاشتباك الصادم في المنتصف (Clash)
                ayumi.x = canvas.width * 0.47;
                demon.x = canvas.width * 0.53;
                ayumi.state = 'attack';
                demon.state = 'attack';
                shake = 8; // اهتزاز الشاشة

                // شرارات طاقة متواصلة في نقطة الاصطدام
                if (frame % 3 === 0) {
                    createExplosion(canvas.width * 0.5, groundY - 50, ayumi.auraColor, demon.auraColor);
                }
            } else if (sequence === 4) {
                // ارتداد الشخصيتين للخلف بسبب الانفجار
                ayumi.x += (canvas.width * 0.2 - ayumi.x) * 0.1;
                demon.x += (canvas.width * 0.8 - demon.x) * 0.1;
                ayumi.state = 'idle';
                demon.state = 'idle';
            } else if (sequence === 5) {
                // إطلاق ضربة قاضية شمسية من أيومي
                ayumi.state = 'attack';
                demon.state = 'idle';
                shake = 15;
                createExplosion(demon.x, groundY - 40, '#ffe600', '#ff0055');
            }
        }

        function drawBackground() {
            // خلفية ليلية متدرجة
            const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bg.addColorStop(0, '#020208');
            bg.addColorStop(0.7, '#0d0b1a');
            bg.addColorStop(1, '#05030a');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // خط الأرضية المضيء
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.75 + 12);
            ctx.lineTo(canvas.width, canvas.height * 0.75 + 12);
            ctx.stroke();
        }

        function animate() {
            frame++;
            updateBattleLogic();

            ctx.save();
            // تطبيق اهتزاز الشاشة مع الضربات
            if (shake > 0) {
                ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
                shake *= 0.9;
            }

            drawBackground();

            // رسم المقاتلين
            drawStickFigure(ayumi, false);
            drawStickFigure(demon, true);

            // تحديث ورسم الجزيئات والشرارات
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            ctx.restore();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
